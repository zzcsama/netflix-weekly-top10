name: Update and Publish Netflix Ranking Data

on:
  push:
    branches: [main]
    paths:
      - data/**
  schedule:
    # Wednesday 09:00 in Asia/Shanghai.
    - cron: "0 1 * * 3"
    # Wednesday 09:20 in Asia/Shanghai as a retry if GitHub skips or delays the busy minute.
    - cron: "20 1 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: netflix-weekly-top10
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      PUBLIC_PAGE_URL: https://zzcsama.github.io/netflix-weekly-top10/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Fetch latest Netflix ranking data
        run: npm run update:data
      - name: Commit updated ranking data
        id: commit-data
        run: |
          if git diff --quiet -- data/rankings.json; then
            echo "No ranking data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/rankings.json
            git commit -m "Update Netflix weekly ranking data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install browser
        if: steps.commit-data.outputs.should_publish == 'true'
        run: PLAYWRIGHT_BROWSERS_PATH=.ms-playwright npx playwright install --with-deps chromium
      - name: Capture ranking images
        if: steps.commit-data.outputs.should_publish == 'true'
        run: npm run capture:all
      - name: Publish to Telegram
        if: steps.commit-data.outputs.should_publish == 'true'
        run: npm run publish:telegram
      - name: Prepare Pages artifact
        if: steps.commit-data.outputs.should_publish == 'true'
        run: rm -rf node_modules .ms-playwright outputs
      - name: Configure GitHub Pages
        if: steps.commit-data.outputs.should_publish == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        if: steps.commit-data.outputs.should_publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        if: steps.commit-data.outputs.should_publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
