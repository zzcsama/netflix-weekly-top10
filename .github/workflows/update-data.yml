name: Update and Publish Netflix Ranking Data

on:
  push:
    branches: [main]
    paths:
      - data/rankings.json
      - .github/workflows/update-data.yml
  schedule:
    # Every Wednesday at 19:00 in Asia/Shanghai, after Netflix's weekly chart is usually live.
    - cron: "0 11 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      PUBLIC_PAGE_URL: https://zzcsama.github.io/netflix-weekly-top10/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install browser
        run: PLAYWRIGHT_BROWSERS_PATH=.ms-playwright npx playwright install --with-deps chromium
      - name: Fetch latest Netflix ranking data
        run: npm run update:data
      - name: Commit updated ranking data
        run: |
          if git diff --quiet -- data/rankings.json; then
            echo "No ranking data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/rankings.json
            git commit -m "Update Netflix weekly ranking data"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Capture ranking images
        run: npm run capture:all
      - name: Publish to Telegram
        run: npm run publish:telegram
